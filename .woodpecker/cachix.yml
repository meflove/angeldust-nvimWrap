when:
  - event: push
    branch: main
  - event: manual
    branch: main
steps:
  - name: build and push
    image: nixos/nix
    environment:
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
      GH_TOKEN:
        from_secret: gh_token
    commands:
      - |
        export NIX_CONFIG="experimental-features = nix-command flakes
        access-tokens = github.com=$GH_TOKEN"
      - nix profile install nixpkgs#cachix
      - cachix authtoken "$CACHIX_AUTH_TOKEN"
      - cachix use meflove
      - cachix use nix-community
      - nix build -L --no-link --print-out-paths .#default | cachix push meflove
